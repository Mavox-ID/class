<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор оценок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            background: #f5f5f5;
            border: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            color: #666;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .content {
            padding: 30px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .subject-form {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .grades-input {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .grade-tag {
            background: #667eea;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .grade-tag button {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 12px;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            margin-right: 10px;
            margin-top: 10px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .subjects-list {
            margin-top: 20px;
        }

        .subject-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .subject-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102,126,234,0.2);
        }

        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .subject-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
        }

        .subject-average {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .kr-section {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .kr-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #667eea;
        }

        .statistics {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-weight: 600;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
        }

        .recommendations {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .recommendations h3 {
            color: #856404;
            margin-bottom: 15px;
        }

        .recommendation-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .target-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .target-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .target-btn.active {
            background: #667eea;
            color: white;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 15px;
            }

            .tab {
                padding: 15px 10px;
                font-size: 14px;
            }

            .subject-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .grades-input {
                gap: 5px;
            }

            .btn {
                width: 100%;
                margin-right: 0;
            }
        }

        @media (min-width: 1024px) {
            .subjects-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Калькулятор оценок за год</h1>
            <p>Отслеживайте свой прогресс и планируйте результаты</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab(0)">1 семестр</button>
            <button class="tab" onclick="switchTab(1)">2 семестр</button>
            <button class="tab" onclick="switchTab(2)">Итоги года</button>
        </div>

        <div class="content">
            <div class="tab-content active" id="semester1">
                <div class="subject-form">
                    <h2>Добавить предмет</h2>
                    <div class="form-group">
                        <label>Название предмета</label>
                        <input type="text" id="subject1Name" placeholder="Например: Математика">
                    </div>
                    <div class="form-group">
                        <label>Обычные оценки</label>
                        <input type="number" id="grade1Input" min="1" max="12" placeholder="Введите оценку">
                        <button class="btn btn-primary" onclick="addGrade(1, false)">+ Добавить оценку</button>
                        <div class="grades-input" id="grades1"></div>
                    </div>
                    <div class="kr-section">
                        <div class="kr-title">Контрольные работы (КР)</div>
                        <label>Оценки за КР (3 оценки = 1 итоговая)</label>
                        <input type="number" id="kr1Input" min="1" max="12" placeholder="Введите оценку за КР">
                        <button class="btn btn-primary" onclick="addGrade(1, true)">+ Добавить оценку за КР</button>
                        <div class="grades-input" id="kr1"></div>
                    </div>
                    <button class="btn btn-success" onclick="saveSubject(1)">Сохранить предмет</button>
                </div>

                <div class="subjects-list" id="subjects1List"></div>
                <div class="statistics" id="stats1"></div>
            </div>

            <div class="tab-content" id="semester2">
                <div style="background: #e8f5e9; padding: 20px; border-radius: 10px; margin-bottom: 20px;">
                    <h3 style="color: #2e7d32; margin-bottom: 15px;">Цель на 2 семестр</h3>
                    <label>Выберите минимальный балл за год:</label>
                    <div class="target-selector">
                        <button class="target-btn active" onclick="setTarget(8)">8 баллов</button>
                        <button class="target-btn" onclick="setTarget(9)">9 баллов</button>
                        <button class="target-btn" onclick="setTarget(10)">10 баллов</button>
                        <button class="target-btn" onclick="setTarget(11)">11 баллов</button>
                        <button class="target-btn" onclick="setTarget(12)">12 баллов</button>
                    </div>
                </div>

                <div class="recommendations" id="recommendations"></div>

                <div class="subject-form">
                    <h2>Добавить оценки за 2 семестр</h2>
                    <div class="form-group">
                        <label>Выберите предмет</label>
                        <select id="subject2Select"></select>
                    </div>
                    <div class="form-group">
                        <label>Обычные оценки</label>
                        <input type="number" id="grade2Input" min="1" max="12" placeholder="Введите оценку">
                        <button class="btn btn-primary" onclick="addGrade(2, false)">+ Добавить оценку</button>
                        <div class="grades-input" id="grades2"></div>
                    </div>
                    <div class="kr-section">
                        <div class="kr-title">Контрольные работы (КР)</div>
                        <label>Оценки за КР</label>
                        <input type="number" id="kr2Input" min="1" max="12" placeholder="Введите оценку за КР">
                        <button class="btn btn-primary" onclick="addGrade(2, true)">+ Добавить оценку за КР</button>
                        <div class="grades-input" id="kr2"></div>
                    </div>
                    <button class="btn btn-success" onclick="saveSubject(2)">Сохранить оценки</button>
                </div>

                <div class="subjects-list" id="subjects2List"></div>
                <div class="statistics" id="stats2"></div>
            </div>

            <div class="tab-content" id="yearResults">
                <div class="statistics" id="yearStats"></div>
                <div class="subjects-list" id="yearList"></div>
                <button class="btn btn-danger" onclick="clearAllData()" style="margin-top: 20px;">Очистить все данные</button>
            </div>
        </div>
    </div>

    <script>
        let data = {
            semester1: [],
            semester2: [],
            targetGrade: 8,
            currentGrades1: [],
            currentKR1: [],
            currentGrades2: [],
            currentKR2: []
        };

        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = name + "=" + JSON.stringify(value) + ";expires=" + d.toUTCString() + ";path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) {
                    try {
                        return JSON.parse(c.substring(nameEQ.length, c.length));
                    } catch (e) {
                        return null;
                    }
                }
            }
            return null;
        }

        function loadData() {
            const saved = getCookie('gradesData');
            if (saved) {
                data = saved;
                renderAll();
            }
        }

        function saveData() {
            setCookie('gradesData', data);
        }

        function switchTab(index) {
            const tabs = document.querySelectorAll('.tab');
            const contents = document.querySelectorAll('.tab-content');
            tabs.forEach((tab, i) => {
                if (i === index) {
                    tab.classList.add('active');
                    contents[i].classList.add('active');
                } else {
                    tab.classList.remove('active');
                    contents[i].classList.remove('active');
                }
            });
            if (index === 1) {
                updateSubject2Select();
                calculateRecommendations();
            }
            if (index === 2) {
                renderYearResults();
            }
        }

        function addGrade(semester, isKR) {
            const input = document.getElementById(isKR ? `kr${semester}Input` : `grade${semester}Input`);
            const value = parseInt(input.value);
            if (value >= 1 && value <= 12) {
                const arr = isKR ? data[`currentKR${semester}`] : data[`currentGrades${semester}`];
                arr.push(value);
                input.value = '';
                renderGrades(semester, isKR);
            }
        }

        function removeGrade(semester, isKR, index) {
            const arr = isKR ? data[`currentKR${semester}`] : data[`currentGrades${semester}`];
            arr.splice(index, 1);
            renderGrades(semester, isKR);
        }

        function renderGrades(semester, isKR) {
            const container = document.getElementById(isKR ? `kr${semester}` : `grades${semester}`);
            const arr = isKR ? data[`currentKR${semester}`] : data[`currentGrades${semester}`];
            container.innerHTML = arr.map((g, i) => 
                `<div class="grade-tag">${g} <button onclick="removeGrade(${semester}, ${isKR}, ${i})">×</button></div>`
            ).join('');
        }

        function calculateKRAverage(krGrades) {
            if (krGrades.length === 0) return null;
            const groups = [];
            for (let i = 0; i < krGrades.length; i += 3) {
                const group = krGrades.slice(i, i + 3);
                if (group.length === 3) {
                    const avg = group.reduce((a, b) => a + b, 0) / 3;
                    groups.push(Math.round(avg));
                }
            }
            return groups;
        }

        function calculateAverage(grades, krGrades) {
            const krAverages = calculateKRAverage(krGrades) || [];
            const allGrades = [...grades, ...krAverages];
            if (allGrades.length === 0) return 0;
            return allGrades.reduce((a, b) => a + b, 0) / allGrades.length;
        }

        function saveSubject(semester) {
            const nameInput = document.getElementById(`subject${semester}Name`);
            const name = nameInput ? nameInput.value.trim() : '';
            
            if (semester === 1) {
                if (!name) {
                    alert('Введите название предмета');
                    return;
                }
                const subject = {
                    name,
                    grades: [...data.currentGrades1],
                    krGrades: [...data.currentKR1]
                };
                data.semester1.push(subject);
                data.currentGrades1 = [];
                data.currentKR1 = [];
                nameInput.value = '';
                renderGrades(1, false);
                renderGrades(1, true);
            } else {
                const select = document.getElementById('subject2Select');
                const subjectName = select.value;
                if (!subjectName) {
                    alert('Выберите предмет');
                    return;
                }
                let subject = data.semester2.find(s => s.name === subjectName);
                if (!subject) {
                    subject = { name: subjectName, grades: [], krGrades: [] };
                    data.semester2.push(subject);
                }
                subject.grades.push(...data.currentGrades2);
                subject.krGrades.push(...data.currentKR2);
                data.currentGrades2 = [];
                data.currentKR2 = [];
                renderGrades(2, false);
                renderGrades(2, true);
            }
            
            saveData();
            renderSemester(semester);
            if (semester === 1) {
                updateSubject2Select();
            }
            if (semester === 2) {
                calculateRecommendations();
            }
        }

        function renderSemester(semester) {
            const subjects = data[`semester${semester}`];
            const container = document.getElementById(`subjects${semester}List`);
            
            if (subjects.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">Предметов пока нет</p>';
                return;
            }

            let html = '<div class="subjects-grid">';
            subjects.forEach((subject, index) => {
                const avg = calculateAverage(subject.grades, subject.krGrades);
                const krAverages = calculateKRAverage(subject.krGrades) || [];
                html += `
                    <div class="subject-card">
                        <div class="subject-header">
                            <div class="subject-name">${subject.name}</div>
                            <div class="subject-average">${avg.toFixed(2)}</div>
                        </div>
                        <div>
                            <strong>Оценки:</strong> ${subject.grades.join(', ') || 'нет'}
                        </div>
                        <div class="kr-section" style="margin-top: 10px;">
                            <div><strong>КР оценки:</strong> ${subject.krGrades.join(', ') || 'нет'}</div>
                            ${krAverages.length > 0 ? `<div><strong>Итоговые КР:</strong> ${krAverages.join(', ')}</div>` : ''}
                        </div>
                        <button class="btn btn-danger" style="margin-top: 15px; width: 100%;" onclick="deleteSubject(${semester}, ${index})">Удалить</button>
                    </div>
                `;
            });
            html += '</div>';
            container.innerHTML = html;

            const semesterAvg = subjects.reduce((sum, s) => sum + calculateAverage(s.grades, s.krGrades), 0) / subjects.length || 0;
            const statsContainer = document.getElementById(`stats${semester}`);
            statsContainer.innerHTML = `
                <div class="stat-row">
                    <div class="stat-label">Всего предметов</div>
                    <div class="stat-value">${subjects.length}</div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">Средний балл за семестр</div>
                    <div class="stat-value">${semesterAvg.toFixed(2)}</div>
                </div>
            `;
        }

        function deleteSubject(semester, index) {
            if (confirm('Удалить этот предмет?')) {
                data[`semester${semester}`].splice(index, 1);
                saveData();
                renderSemester(semester);
                if (semester === 1) {
                    updateSubject2Select();
                    calculateRecommendations();
                }
            }
        }

        function updateSubject2Select() {
            const select = document.getElementById('subject2Select');
            select.innerHTML = '<option value="">Выберите предмет</option>' +
                data.semester1.map(s => `<option value="${s.name}">${s.name}</option>`).join('');
        }

        function setTarget(target) {
            data.targetGrade = target;
            document.querySelectorAll('.target-btn').forEach(btn => {
                btn.classList.remove('active');
                if (parseInt(btn.textContent) === target) {
                    btn.classList.add('active');
                }
            });
            saveData();
            calculateRecommendations();
        }

        function calculateRecommendations() {
            const container = document.getElementById('recommendations');
            if (data.semester1.length === 0) {
                container.innerHTML = '<p>Добавьте предметы в 1 семестр для расчета рекомендаций</p>';
                return;
            }

            let html = '<h3>Рекомендации для достижения цели ' + data.targetGrade + ' баллов</h3>';
            
            data.semester1.forEach(subject1 => {
                const avg1 = calculateAverage(subject1.grades, subject1.krGrades);
                const subject2 = data.semester2.find(s => s.name === subject1.name);
                const avg2 = subject2 ? calculateAverage(subject2.grades, subject2.krGrades) : 0;
                const currentYearAvg = subject2 ? (avg1 + avg2) / 2 : avg1;
                
                const neededAvgForYear = data.targetGrade * 2 - avg1;
                
                let status = '';
                let gradesSuggestion = '';
                
                if (currentYearAvg >= data.targetGrade) {
                    status = '✅ Цель достигнута!';
                    gradesSuggestion = `Годовой балл: ${currentYearAvg.toFixed(2)} ≥ ${data.targetGrade}`;
                } else {
                    const gradesNeeded = subject2 ? subject2.grades.length + calculateKRAverage(subject2.krGrades).length : 0;
                    
                    if (neededAvgForYear > 12) {
                        status = '❌ Невозможно достичь!';
                        gradesSuggestion = `Нужен средний ${neededAvgForYear.toFixed(2)} во 2 сем (максимум 12)`;
                    } else if (neededAvgForYear <= 0) {
                        status = '✅ Цель уже достигнута!';
                        gradesSuggestion = `Годовой балл: ${currentYearAvg.toFixed(2)} ≥ ${data.targetGrade}`;
                    } else {
                        status = '⚠️ Требуется усилие';
                        
                        const currentGrades = subject2 ? subject2.grades.length + calculateKRAverage(subject2.krGrades).length : 0;
                        
                        let suggestions = [];
                        for (let numGrades = 1; numGrades <= 10; numGrades++) {
                            const totalCurrentSum = avg2 * currentGrades;
                            const neededSum = neededAvgForYear * (currentGrades + numGrades) - totalCurrentSum;
                            const neededGradeAvg = neededSum / numGrades;
                            
                            if (neededGradeAvg >= 1 && neededGradeAvg <= 12) {
                                suggestions.push(`${numGrades} оценок по ${Math.ceil(neededGradeAvg)}`);
                                if (suggestions.length >= 3) break;
                            }
                        }
                        
                        if (suggestions.length > 0) {
                            gradesSuggestion = `Нужен средний ${neededAvgForYear.toFixed(2)} во 2 сем<br>Варианты: ${suggestions.join(' или ')}`;
                        } else {
                            gradesSuggestion = `Нужен средний ${neededAvgForYear.toFixed(2)} во 2 сем`;
                        }
                    }
                }

                html += `
                    <div class="recommendation-item">
                        <strong>${subject1.name}</strong> ${status}<br>
                        <small style="color: #666;">1 сем: ${avg1.toFixed(2)} | 2 сем: ${avg2.toFixed(2)} | Год: ${currentYearAvg.toFixed(2)}</small><br>
                        <div style="margin-top: 8px; color: #333;">${gradesSuggestion}</div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function renderYearResults() {
            const container = document.getElementById('yearStats');
            const listContainer = document.getElementById('yearList');

            if (data.semester1.length === 0) {
                container.innerHTML = '<p style="text-align: center;">Добавьте предметы для просмотра итогов</p>';
                listContainer.innerHTML = '';
                return;
            }

            let totalYearAvg = 0;
            let subjectsCount = 0;
            let html = '<div class="subjects-grid">';

            data.semester1.forEach(subject1 => {
                const avg1 = calculateAverage(subject1.grades, subject1.krGrades);
                const subject2 = data.semester2.find(s => s.name === subject1.name);
                const avg2 = subject2 ? calculateAverage(subject2.grades, subject2.krGrades) : 0;
                const yearAvg = subject2 ? (avg1 + avg2) / 2 : avg1;
                
                totalYearAvg += yearAvg;
                subjectsCount++;

                html += `
                    <div class="subject-card">
                        <div class="subject-header">
                            <div class="subject-name">${subject1.name}</div>
                            <div class="subject-average">${yearAvg.toFixed(2)}</div>
                        </div>
                        <div class="stat-row" style="border-bottom: 1px solid #e0e0e0; padding: 10px 0;">
                            <div>1 семестр</div>
                            <div><strong>${avg1.toFixed(2)}</strong></div>
                        </div>
                        <div class="stat-row" style="padding: 10px 0;">
                            <div>2 семестр</div>
                            <div><strong>${avg2.toFixed(2)}</strong></div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            listContainer.innerHTML = html;

            const overallAvg = totalYearAvg / subjectsCount;
            container.innerHTML = `
                <div class="stat-row">
                    <div class="stat-label">Общий средний балл за год</div>
                    <div class="stat-value">${overallAvg.toFixed(2)}</div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">Всего предметов</div>
                    <div class="stat-value">${subjectsCount}</div>
                </div>
                <div class="stat-row">
                    <div class="stat-label">Предметов с баллом ≥ ${data.targetGrade}</div>
                    <div class="stat-value">${data.semester1.filter(s => {
                        const avg1 = calculateAverage(s.grades, s.krGrades);
                        const s2 = data.semester2.find(s2 => s2.name === s.name);
                        const avg = s2 ? (avg1 + calculateAverage(s2.grades, s2.krGrades)) / 2 : avg1;
                        return avg >= data.targetGrade;
                    }).length}</div>
                </div>
            `;
        }

        function clearAllData() {
            if (confirm('Вы уверены? Все данные будут удалены!')) {
                data = {
                    semester1: [],
                    semester2: [],
                    targetGrade: 8,
                    currentGrades1: [],
                    currentKR1: [],
                    currentGrades2: [],
                    currentKR2: []
                };
                saveData();
                renderAll();
            }
        }

        function renderAll() {
            renderSemester(1);
            renderSemester(2);
            renderGrades(1, false);
            renderGrades(1, true);
            renderGrades(2, false);
            renderGrades(2, true);
            updateSubject2Select();
            calculateRecommendations();
            setTarget(data.targetGrade);
        }

        loadData();
    </script>
</body>
</html>
